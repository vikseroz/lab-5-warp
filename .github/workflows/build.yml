
name: Build project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm runner
        run: echo "Runner is ready"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: ls -la
